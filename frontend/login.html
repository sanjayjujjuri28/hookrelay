<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HookRelay — Sign In</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="brand">
                <div class="brand-mark">H</div>
                <div>
                    <h2>HookRelay</h2>
                    <span>Webhook Infrastructure</span>
                </div>
            </div>

            <div class="auth-heading">
                <span class="eyebrow">CONTROL CENTER</span>
                <h2>Welcome back.</h2>
                <p>
                    Sign in to manage your webhook endpoints, monitor deliveries, and inspect payloads.
                </p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="developer@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="/forgot-password.html" class="auth-link">Forgot password?</a>
                    </div>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Sign in
                </button>

                <div
                    id="loginMessage"
                    class="message"
                ></div>

            </form>

            <div class="auth-footer">
                <span>Don't have an account?</span>
                <a href="/register.html" class="auth-link">Create account</a>
            </div>

        </div>

    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>

</body>

</html>
