<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HookRelay — Forgot Password</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="brand">
                <div class="brand-mark">H</div>
                <div>
                    <h2>HookRelay</h2>
                    <span>Webhook Infrastructure</span>
                </div>
            </div>

            <div class="auth-heading">
                <span class="eyebrow">PASSWORD RECOVERY</span>
                <h2>Reset password.</h2>
                <p>
                    Enter your account's email address and we'll send you a 6-digit one-time code to reset your password.
                </p>
            </div>

            <form id="forgotPasswordForm">

                <div class="form-group">
                    <label for="email">Account email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@company.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Send verification code
                </button>

                <div
                    id="forgotMessage"
                    class="message"
                ></div>

            </form>

            <div class="auth-footer">
                <span>Remembered your password?</span>
                <a href="/login.html" class="auth-link">Back to sign in</a>
            </div>

        </div>

    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>

</body>

</html>
