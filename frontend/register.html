<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HookRelay — Create Account</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="brand">
                <div class="brand-mark">H</div>
                <div>
                    <h2>HookRelay</h2>
                    <span>Webhook Infrastructure</span>
                </div>
            </div>

            <div class="auth-heading">
                <span class="eyebrow">DEVELOPER ONBOARDING</span>
                <h2>Create your account.</h2>
                <p>
                    Set up your secure developer environment to start relaying and monitoring webhooks.
                </p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="email">Work email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@company.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Choose a strong password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                    <span class="form-hint">Minimum 6 characters</span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Repeat your password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Create account
                </button>

                <div
                    id="registerMessage"
                    class="message"
                ></div>

            </form>

            <div class="auth-footer">
                <span>Already have an account?</span>
                <a href="/login.html" class="auth-link">Sign in</a>
            </div>

        </div>

    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>

</body>

</html>
